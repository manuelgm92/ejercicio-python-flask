<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registro</title>
        <link rel="stylesheet"
            href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <div class="container">
            <h1>Registro</h1>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert-error">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}


        <form action="{{url_for('registro')}}" method="POST">
            <label for="usuario">Usuario: </label>
            <input type="text" name="usuario" id="usuario" required>
            <br><br>
            <label for="password">Contraseña: </label>
            <input type="password" name="password" id="password" required>
            <br><br>
            <label for="passwd">Verificar Contraseña: </label>
            <input type="password" name="confirmar_password" id="confirmar_password"
                required>
            <br><br>
            <button type="submit">Registrarse</button>
        </form>
        <a href="{{ url_for('inicio') }}" class="btn-secondary">Volver a login</a>
        </div>
    </body>
</html>
